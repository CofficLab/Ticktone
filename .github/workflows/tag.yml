name: Tag & Release

# 当有 commit 推到 main 时，根据 conventional commits 决定递增级别，
# 打出新 v* tag 并推送，然后创建 GitHub Release。
#
# 递增规则（与 Lumi 一致）：
#   - BREAKING CHANGE / feat! / fix! / refactor!  → major
#   - feat:                                       → minor
#   - 其他（fix / chore / docs / style / ...）      → patch
#
# 版本号来源：取 project.yml 中的 MARKETING_VERSION 和最新 v* tag 中较高者，
# 再根据 bump-version.sh 的结果递增。

on:
  push:
    branches:
      - main

concurrency:
  # 同一个 main 分支上的多次 push 串行执行，
  # 避免并发 run 各自算出同一个 tag 互相冲突。
  group: tag-and-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # 推 tag + 创建 Release 需要

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute next version tag
        id: version
        run: |
          chmod +x .github/scripts/bump-version.sh .github/scripts/calculate-version.sh
          NEXT=$(bash .github/scripts/calculate-version.sh)
          echo "next_tag=v${NEXT}" >> "$GITHUB_ENV"
          echo "version=${NEXT}"   >> "$GITHUB_ENV"

          echo "## 🏷️ Tag & Release"                >> "$GITHUB_STEP_SUMMARY"
          echo "- **Next**: \`v${NEXT}\`"            >> "$GITHUB_STEP_SUMMARY"

      - name: Generate changelog
        id: changelog
        run: |
          set -euo pipefail
          # 找到上一个 v* tag（按版本号排序）
          PREVIOUS=$(git tag -l "v*" | sort -V | tail -n 1 2>/dev/null || echo "")
          if [ -n "$PREVIOUS" ]; then
            RANGE="${PREVIOUS}..HEAD"
          else
            RANGE="HEAD"
          fi

          # 收集 commit 生成 changelog
          CHANGES=$(git log $RANGE --no-merges --pretty=format:'- %s' | sort -u | head -30) || true
          if [ -z "$CHANGES" ]; then
            CHANGES="- Maintenance and stability improvements"
          fi

          # 写入文件供 Release 使用
          {
            echo "## Changes"
            echo ""
            echo "$CHANGES"
          } > changelog.md

          cat changelog.md

      - name: Create and push tag
        run: |
          set -euo pipefail
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git tag "${{ env.next_tag }}"
          git push origin "${{ env.next_tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 先检查是否已存在该 release（幂等）
          if gh release view "${{ env.next_tag }}" >/dev/null 2>&1; then
            echo "Release ${{ env.next_tag }} already exists, updating notes"
            gh release edit "${{ env.next_tag }}" --notes-file changelog.md
          else
            gh release create "${{ env.next_tag }}" \
              --target "${{ github.sha }}" \
              --title "${{ env.next_tag }}" \
              --notes-file changelog.md
          fi
