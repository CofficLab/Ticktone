name: Metronome
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"

packages:
  FactoryMetronome:
    path: Packages/FactoryMetronome
  LumiKernel:
    url: https://github.com/lumi-softworks/LumiKernel.git
    exactVersion: 1.1.1
  LumiUI:
    url: https://github.com/lumi-softworks/LumiUI.git
    exactVersion: 1.17.1
  LumiProviders:
    url: https://github.com/lumi-softworks/LumiProviders.git
    exactVersion: 1.23.0
  LumiLocalization:
    url: https://github.com/lumi-softworks/LumiLocalization.git
    exactVersion: 1.0.2
  LumiLogging:
    url: https://github.com/lumi-softworks/LumiLogging.git
    exactVersion: 1.0.2
  LumiSettings:
    url: https://github.com/lumi-softworks/LumiSettings.git
    exactVersion: 1.1.1
  LumiThemePack:
    url: https://github.com/lumi-softworks/LumiThemePack.git
    exactVersion: 1.0.13
  LumiPluginAbout:
    url: https://github.com/lumi-softworks/LumiPluginAbout.git
    exactVersion: 3.0.4
  LumiPluginCommand:
    url: https://github.com/lumi-softworks/LumiPluginCommand.git
    exactVersion: 1.0.2
  LumiPluginPluginManager:
    url: https://github.com/lumi-softworks/LumiPluginPluginManager.git
    exactVersion: 1.7.1
  LumiPluginSettingView:
    url: https://github.com/lumi-softworks/LumiPluginSettingView.git
    exactVersion: 1.0.4
  LumiPluginStorage:
    url: https://github.com/lumi-softworks/LumiPluginStorage.git
    exactVersion: 1.2.2
  LumiPluginThemePack:
    url: https://github.com/lumi-softworks/LumiPluginThemePack.git
    exactVersion: 1.2.2
  LumiPluginToast:
    url: https://github.com/lumi-softworks/LumiPluginToast.git
    exactVersion: 1.2.4

targets:
  Metronome:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: MetronomeApp
        excludes:
          - "Metronome-Info.plist"
          - "Metronome-iOS-Info.plist"
          - "Metronome.xcconfig"
          - "App.entitlements"
    dependencies:
      - package: FactoryMetronome
        product: FactoryMetronomeMac
      - package: FactoryMetronome
        product: FactoryMetronomeIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coffic.metronome
        PRODUCT_NAME: Metronome
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_EMIT_LOC_STRINGS: YES
        DEVELOPMENT_TEAM: Y6HZ9JJYV6
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: MetronomeApp/App.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        DEAD_CODE_STRIPPING: YES
        COMBINE_HIDPI_IMAGES: YES
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/Frameworks"
        "INFOPLIST_FILE[sdk=macosx*]": MetronomeApp/Metronome-Info.plist
        "INFOPLIST_FILE[sdk=iphoneos*]": MetronomeApp/Metronome-iOS-Info.plist
        "INFOPLIST_FILE[sdk=iphonesimulator*]": MetronomeApp/Metronome-iOS-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Ticktone
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ENABLE_INCOMING_NETWORK_CONNECTIONS: NO
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: NO
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: NO
        ENABLE_RESOURCE_ACCESS_BLUETOOTH: NO
        ENABLE_RESOURCE_ACCESS_CALENDARS: NO
        ENABLE_RESOURCE_ACCESS_CAMERA: NO
        ENABLE_RESOURCE_ACCESS_CONTACTS: NO
        ENABLE_RESOURCE_ACCESS_LOCATION: NO
        ENABLE_RESOURCE_ACCESS_PRINTING: NO
        ENABLE_RESOURCE_ACCESS_USB: NO

schemes:
  Metronome:
    build:
      targets:
        Metronome: all
    run:
      config: Debug
    archive:
      config: Release
